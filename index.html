<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crew Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #game-board {
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 400px;
            height: 200px;
            position: relative;
        }

        #game-hand {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-top: 50px;
        }

        .player-label {
            font-weight: bold;
        }

        .highlight {
            color: rgb(194, 90, 90); 
        }

        .empty-cell {
            background-color: #f0f0f0; 
            width: 30px;
            height: 50px;
        }

        .player {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            margin-bottom: 10px;
        }

        .player span {
            margin-right: 10px;
        }

        .card {
            width: 30px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            border-radius: 3px;
        }

        .card.P {
            background-color: pink;
        }

        .card.G {
            background-color: green;
        }

        .card.Y {
            background-color: yellow;
            color: black;
        }

        .card.B {
            background-color: rgb(23, 234, 237);
        }

        .card.R {
            background-color: black;
        }

        .task {
            border: 2px solid red;
        }

        .communication {
            border: 2px solid blue;
        }

    </style>
    <script>
        let socket;

        async function startGame() {
            const playerTypes = [
                document.getElementById("player-1").value,
                document.getElementById("player-2").value,
                document.getElementById("player-3").value,
            ];

            socket = new WebSocket("ws://localhost:8000/ws");
            socket.onmessage = handleMessage;

            socket.onopen = () => {
                socket.send(JSON.stringify({ player_types: playerTypes }));
                document.getElementById("player-selection").style.display = "none";
                document.getElementById("game-container").style.display = "flex";
            };
        }

        function handleMessage(event) {
            const data = JSON.parse(event.data);
            if (data.action === "play_card") {
                displayPlayCard(data.hand);
            } else if (data.action === "choose_task") {
                displayChooseTask(data.tasks, data.hand);
            } else if (data.action === "communicate") {
                displayCommunicate(data.signals);
            } else if (data.action === "round_state") {
                displayRoundState(data.roundState);
            } else if (data.action === "game_over") {
                displayGameOver();
            } else if (data.action === "round_failure") {
                displayRoundFailure(data.message);
            }
        }

        function displayPlayCard(hand) {
            const container = document.getElementById("game-select");
            container.innerHTML = `<h3>Choose a Card to play</h3>`;
            const handDiv = document.createElement("div");
            hand.forEach(card => {
                const button = document.createElement("button");
                button.textContent = card;
                button.onclick = () => {
                    socket.send(JSON.stringify({ action: "play_card", suit: card[0], rank: parseInt(card.slice(1)) }));
                };
                handDiv.appendChild(button);
            });
            container.appendChild(handDiv);
        }

        function displayChooseTask(tasks) {
            const container = document.getElementById("game-select");
            container.innerHTML = `<h3>Choose a Task</h3>`;
            tasks.forEach(task => {
                const button = document.createElement("button");
                button.textContent = task;
                button.onclick = () => {
                    socket.send(JSON.stringify({ action: "choose_task", suit: task[0], rank: parseInt(task.slice(1)) }));
                };
                container.appendChild(button);
            });
        }

        function displayCommunicate(signals) {
            const container = document.getElementById("game-select");
            container.innerHTML = `<h3>Choose Communication</h3>`;
            signals.forEach(([card, signal]) => {
                const button = document.createElement("button");
                button.textContent = `${card} - ${signal}`;
                button.onclick = () => {
                    socket.send(JSON.stringify({
                        action: "communicate",
                        suit: card[0],
                        rank: parseInt(card.slice(1)),
                        signal
                    }));
                };
                container.appendChild(button);
            });
        }

        function createCardElement(card, type = "") {
            if (!card) return null;
            const suit = card[0];
            const rank = card.slice(1);
            const cardDiv = document.createElement("div");
            cardDiv.className = `card ${suit} ${type}`;
            cardDiv.textContent = rank;
            return cardDiv;
        }

        function displayRoundState(roundState) {
            const existingBoard = document.getElementById("game-board");
            existingBoard.innerHTML = "";
            
            // Add header with round number
            const header = document.getElementById("game-header");
            header.innerHTML = `<h2>Round ${roundState.roundNumber}</h2>`;

            const startingPlayer = roundState.startingPlayer;

            const horizontalDiv = document.getElementById("game-hand");
            horizontalDiv.innerHTML = "";
            roundState.hand.forEach(card => {
                const cardDiv = createCardElement(card);
                horizontalDiv.appendChild(cardDiv);
            });

            for (let i = 0; i < 4; i++) {
                // Nazwa gracza
                const playerLabel = document.createElement("div");
                playerLabel.className = "player-label";
                if (i === startingPlayer) playerLabel.classList.add("highlight");
                playerLabel.textContent = `player-${i}`;
                existingBoard.appendChild(playerLabel);

                // Task
                const tasks = roundState.tasks.find(([playerId]) => playerId === i)?.[1] || [];
                const taskCell = document.createElement("div");
                if (tasks.length > 0) {
                    const taskCard = createCardElement(tasks[0], "task");
                    taskCell.appendChild(taskCard);
                } else {
                    taskCell.className = "empty-cell";
                }
                existingBoard.appendChild(taskCell);

                // Komunikat
                const communication = roundState.communications.find(([playerId]) => playerId === i)?.[1];
                const commCell = document.createElement("div");
                if (communication) {
                    const commCard = createCardElement(communication, "communication");
                    commCell.appendChild(commCard);
                } else {
                    commCell.className = "empty-cell";
                }
                existingBoard.appendChild(commCell);

                // Zagrana karta
                const playedCards = roundState.playedCards.find(([playerId]) => playerId === i)?.[1];
                const playedCell = document.createElement("div");
                if (playedCards) {
                    const playedCard = createCardElement(playedCards, "played");
                    playedCell.appendChild(playedCard);
                } else {
                    playedCell.className = "empty-cell";
                }
                existingBoard.appendChild(playedCell);
            }
        }

        function displayGameOver() {
            const container = document.getElementById("game-container");
            container.innerHTML = `<h1>"You Win!"</h1>`;
            const restartButton = document.createElement("button");
            restartButton.textContent = "Start New Game";
            restartButton.onclick = () => {
                location.reload(); // Reload the page to reset the game
            };
            container.appendChild(restartButton);
        }

        function displayRoundFailure(message) {
            const container = document.getElementById("game-container");
            const failureMessage = document.createElement("div");
            failureMessage.innerHTML = `<p style="color: red;">${message}</p>`;
            container.appendChild(failureMessage);
            const restartButton = document.createElement("button");
            restartButton.textContent = "Start New Game";
            restartButton.onclick = () => {
                location.reload(); // Reload the page to reset the game
            };
            container.appendChild(restartButton);
        }
    </script>
</head>

<body>
    <h1>The Crew Game</h1>
    <div id="player-selection">
        <label for="player-1">Player 1:</label>
        <select id="player-1">
            <option value="intelligent">Intelligent</option>
            <option value="random">Random</option>
        </select>
        <label for="player-2">Player 2:</label>
        <select id="player-2">
            <option value="intelligent">Intelligent</option>
            <option value="random">Random</option>
        </select>
        <label for="player-3">Player 3:</label>
        <select id="player-3">
            <option value="intelligent">Intelligent</option>
            <option value="random">Random</option>
        </select>
        <button onclick="startGame()">Start Game</button>
    </div>
    <div id="game-container">
        <div id="game-header"></div>
        <div id="game-board"></div>
        <div id="game-hand"></div>
        <div id="game-select"></div>
    </div>
</body>

</html>
