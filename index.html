<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crew Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #game-board {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 400px;
            height: 400px;
            position: relative;
        }

        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card {
            width: 50px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            margin: 5px;
        }

        .card.P {
            background-color: pink;
        }

        .card.G {
            background-color: green;
        }

        .card.Y {
            background-color: yellow;
            color: black;
        }

        .card.B {
            background-color: blue;
        }

        .card.R {
            background-color: black;
        }

        .task {
            border: 2px solid red;
        }

        .communication {
            border: 2px solid blue;
        }

        .played {
            width: 70px;
            height: 100px;
            position: absolute;
        }
    </style>
    <script>
        let socket;

        async function startGame() {
            const playerTypes = [
                document.getElementById("player-1").value,
                document.getElementById("player-2").value,
                document.getElementById("player-3").value,
            ];

            socket = new WebSocket("ws://localhost:8000/ws");
            socket.onmessage = handleMessage;

            socket.onopen = () => {
                socket.send(JSON.stringify({ player_types: playerTypes }));
                document.getElementById("player-selection").style.display = "none";
                document.getElementById("game-container").style.display = "flex";
            };
        }

        function handleMessage(event) {
            const data = JSON.parse(event.data);
            if (data.action === "play_card") {
                displayPlayCard(data.hand);
            } else if (data.action === "choose_task") {
                displayChooseTask(data.tasks);
            } else if (data.action === "communicate") {
                displayCommunicate(data.signals);
            } else if (data.action === "round_state") {
                displayRoundState(data.roundState);
            } else if (data.action === "game_over") {
                displayGameOver();
            } else if (data.action === "round_failure") {
                displayRoundFailure(data.message);
            }
        }

        function displayPlayCard(hand) {
            const container = document.getElementById("game-container");
            // create div element below elements from displayRoundState
            const handDiv = document.createElement("div");
            hand.forEach(card => {
                const button = document.createElement("button");
                button.textContent = card;
                button.onclick = () => {
                    socket.send(JSON.stringify({ action: "play_card", suit: card[0], rank: parseInt(card.slice(1)) }));
                };
                handDiv.appendChild(button);
            });
            container.appendChild(handDiv);
        }

        function displayChooseTask(tasks) {
            const container = document.getElementById("game-container");
            container.innerHTML = `<h3>Choose a Task</h3>`;
            tasks.forEach(task => {
                const button = document.createElement("button");
                button.textContent = task;
                button.onclick = () => {
                    socket.send(JSON.stringify({ action: "choose_task", suit: task[0], rank: parseInt(task.slice(1)) }));
                };
                container.appendChild(button);
            });
        }

        function displayCommunicate(signals) {
            const container = document.getElementById("game-container");
            container.innerHTML = `<h3>Choose Communication</h3>`;
            signals.forEach(([card, signal]) => {
                const button = document.createElement("button");
                button.textContent = `${card} - ${signal}`;
                button.onclick = () => {
                    socket.send(JSON.stringify({
                        action: "communicate",
                        suit: card[0],
                        rank: parseInt(card.slice(1)),
                        signal
                    }));
                };
                container.appendChild(button);
            });
        }

        function createCardElement(card, type = "") {
            if (!card) return null;
            const suit = card[0];
            const rank = card.slice(1);
            const cardDiv = document.createElement("div");
            cardDiv.className = `card ${suit} ${type}`;
            cardDiv.textContent = rank;
            return cardDiv;
        }

        function displayRoundState(roundState) {
            const container = document.getElementById("game-container");
            container.innerHTML = `<h3>Round ${roundState.roundNumber}</h3>`;
            existingBoard = document.getElementById("game-board");
            if (existingBoard) {
                existingBoard.remove();
            } else {
                existingBoard = document.createElement("div");
                existingBoard.id = "game-board";
            }

            for (let i = 0; i < 4; i++) {
                const playerDiv = document.createElement("div");
                playerDiv.className = "player";
                playerDiv.id = `player-${i}`;
                existingBoard.appendChild(playerDiv);
            }

            roundState.tasks.forEach(([playerId, tasks]) => {
                const playerDiv = document.getElementById(`player-${playerId}`); // Fixed method call
                tasks.forEach(task => {
                    const taskCard = createCardElement(task, "task"); // Corrected variable name
                    if (playerDiv) playerDiv.appendChild(taskCard); // Updated to use taskCard
                });
            });

            roundState.communications.forEach(([playerId, communication]) => {
                const commCard = createCardElement(communication, "communication");
                const playerDiv = document.getElementById(`player-${playerId}`); // Fixed method call
                if (playerDiv) playerDiv.appendChild(commCard);
            });

            roundState.playedCards.forEach(([playerId, card]) => {
                const playedCard = createCardElement(card, "played");
                const playerDiv = document.getElementById(`player-${playerId}`);
                if (playerDiv) playerDiv.appendChild(playedCard);
            });

            container.appendChild(existingBoard);
        }

        function displayGameOver() {
            const container = document.getElementById("game-container");
            container.innerHTML = `<h1>"You Win!"</h1>`;
            const restartButton = document.createElement("button");
            restartButton.textContent = "Start New Game";
            restartButton.onclick = () => {
                location.reload(); // Reload the page to reset the game
            };
            container.appendChild(restartButton);
        }

        function displayRoundFailure(message) {
            const container = document.getElementById("game-container");
            const failureMessage = document.createElement("div");
            failureMessage.innerHTML = `<p style="color: red;">${message}</p>`;
            container.appendChild(failureMessage);
            const restartButton = document.createElement("button");
            restartButton.textContent = "Start New Game";
            restartButton.onclick = () => {
                location.reload(); // Reload the page to reset the game
            };
            container.appendChild(restartButton);
        }
    </script>
</head>

<body>
    <h1>The Crew Game</h1>
    <div id="player-selection">
        <label for="player-1">Player 1:</label>
        <select id="player-1">
            <option value="intelligent">Intelligent</option>
            <option value="random">Random</option>
        </select>
        <label for="player-2">Player 2:</label>
        <select id="player-2">
            <option value="intelligent">Intelligent</option>
            <option value="random">Random</option>
        </select>
        <label for="player-3">Player 3:</label>
        <select id="player-3">
            <option value="intelligent">Intelligent</option>
            <option value="random">Random</option>
        </select>
        <button onclick="startGame()">Start Game</button>
    </div>
    <div id="game-container">
        <div id="game-board"></div>
    </div>
</body>

</html>
